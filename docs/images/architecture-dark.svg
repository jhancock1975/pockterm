<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="t d">
<title id="t">How Pockterm is put together</title>
<desc id="d">Four feature columns — Terminal, Files, Port forwarding and the AI assistant — each run from a SwiftUI screen through a model to a service. The SSH services get credentials from HostConnection, which reads hosts from SwiftData and secrets from the iOS Keychain. Underneath are SwiftTerm, Citadel, swift-nio-ssh, SwiftNIO and swift-crypto.</desc>
